<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok OAuth Callback</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #17211d; background: #f7faf8; }
    main { max-width: 820px; margin: 0 auto; padding: 48px 20px; }
    textarea { width: 100%; min-height: 140px; box-sizing: border-box; font: 14px/1.4 Consolas, monospace; }
    code { word-break: break-all; background: #eaf1ed; padding: 2px 5px; }
  </style>
</head>
<body>
  <main>
    <h1>TikTok authorization received</h1>
    <p>Copy the full callback URL below and paste it back into Codex.</p>
    <textarea id="callbackUrl" readonly></textarea>
    <p>Authorization code:</p>
    <p><code id="code"></code></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("callbackUrl").value = window.location.href;
    document.getElementById("code").textContent = params.get("code") || params.get("error") || "No code found.";
  </script>
</body>
</html>
