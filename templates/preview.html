<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Video Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Verdana, Geneva, sans-serif;
      background: #080d0b;
      color: #f4f7f2;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(94, 230, 168, 0.16), transparent 38%),
        radial-gradient(circle at 50% 100%, rgba(244, 201, 93, 0.16), transparent 34%),
        #080d0b;
    }
    .shell {
      width: min(100vw, 540px);
      display: grid;
      gap: 12px;
      padding: 16px;
    }
    canvas {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #09110f;
      border: 1px solid rgba(244, 247, 242, 0.16);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    button {
      border: 1px solid rgba(244, 247, 242, 0.18);
      background: #101c18;
      color: #f4f7f2;
      min-height: 42px;
      padding: 0 14px;
      cursor: pointer;
    }
    button:hover {
      border-color: rgba(94, 230, 168, 0.7);
    }
    body.capture {
      background: #09110f;
    }
    body.capture .shell {
      width: 100vw;
      padding: 0;
      gap: 0;
    }
    body.capture canvas {
      width: 100vw;
      height: 100vh;
      border: 0;
      box-shadow: none;
    }
    body.capture .controls {
      display: none;
    }
  </style>
</head>
<body>
  <main class="shell">
    <canvas id="video" width="1080" height="1920"></canvas>
    <div class="controls">
      <button id="restart" type="button">Rejouer</button>
      <button id="snapshot" type="button">Image</button>
    </div>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).has("capture")) {
      document.body.classList.add("capture");
    }

    const spec = __SCENE_SPEC__;
    const canvas = document.getElementById("video");
    const ctx = canvas.getContext("2d");
    const W = spec.meta.width;
    const H = spec.meta.height;
    const duration = spec.meta.durationSeconds;
    const points = spec.chart.points;
    const style = spec.style;
    let startTime = performance.now();
    window.renderDone = false;

    document.getElementById("restart").addEventListener("click", () => {
      startTime = performance.now();
      window.renderDone = false;
      requestAnimationFrame(draw);
    });

    document.getElementById("snapshot").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "cover.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    function draw(now) {
      const elapsed = Math.min((now - startTime) / 1000, duration);
      const t = elapsed / duration;
      paintFrame(t, elapsed);
      if (elapsed < duration) {
        requestAnimationFrame(draw);
      } else {
        window.renderDone = true;
      }
    }

    function paintFrame(t, seconds) {
      ctx.clearRect(0, 0, W, H);
      background(t);
      header(seconds);
      chart(t);
      overlays(t);
      subtitles(seconds);
      footer();
    }

    function background(t) {
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, "#06110d"); bg.addColorStop(0.5, "#0b1b15"); bg.addColorStop(1, "#030806");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      const glow = ctx.createRadialGradient(W * (0.2 + t * 0.4), H * 0.12, 20, W * 0.36, H * 0.22, 620);
      glow.addColorStop(0, "rgba(94,230,168,0.22)"); glow.addColorStop(1, "rgba(94,230,168,0)");
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
      const gold = ctx.createRadialGradient(W * 0.88, H * 0.84, 20, W * 0.88, H * 0.84, 480);
      gold.addColorStop(0, "rgba(244,201,93,0.13)"); gold.addColorStop(1, "rgba(244,201,93,0)");
      ctx.fillStyle = gold; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 0.1; ctx.strokeStyle = "#dfffea"; ctx.lineWidth = 1;
      for (let x = -160; x < W + 260; x += 72) line(x + t * 28, 0, x - 470 + t * 28, H);
      ctx.globalAlpha = 1;
    }

    function header(seconds) {
      const n = spec.narrative;
      roundRect(56, 58, W - 112, 128, 28, "rgba(8,25,18,0.82)");
      strokeRoundRect(56, 58, W - 112, 128, 28, "rgba(120,245,186,0.34)", 2);
      roundRect(78, 82, 64, 64, 20, style.accent);
      text("B", 96, 131, 38, "#07100c", "900");
      text("BOURSE.IO", 162, 108, 29, style.accent, "900");
      text("DECODE LA BOURSE", 162, 140, 18, style.muted, "800");
      pill(spec.narrative.templateLabel ?? spec.chart.periodLabel, W - 354, 91, 244, 42, style.accentHot, "#171006");
      pill(spec.brief.subject.ticker, W - 238, 142, 128, 30, "rgba(94,230,168,0.22)", style.text);
      const hookAlpha = clamp(1 - Math.max(0, seconds - 4.4) / 1.6, 0, 1);
      ctx.globalAlpha = hookAlpha;
      roundRect(62, 226, W - 124, 176, 28, "rgba(5,16,11,0.66)");
      wrapText(n.hook, 88, 284, W - 176, 57, style.text, "800", 2);
      ctx.globalAlpha = 1;
      const titleAlpha = clamp((seconds - 2.6) / 1.2, 0, 1);
      ctx.globalAlpha = titleAlpha;
      text(n.title, 72, 450, 78, style.text, "900");
      text(n.subtitle, 76, 495, 27, style.muted, "600");
      ctx.globalAlpha = 1;
    }

    function chart(t) {
      const panelX = 48;
      const panelY = 438;
      const panelW = W - 96;
      const panelH = 890;
      const chartStart = panelY + 128;
      const chartHeight = 610;
      const chartLeft = panelX + 126;
      const chartWidth = panelW - 178;
      const chartProgress = smoothstep(clamp((t - 0.12) / 0.66, 0, 1));
      const visibleCount = Math.max(1, Math.ceil(points.length * chartProgress));
      const visible = points.slice(0, visibleCount);
      const min = spec.chart.axisMin ?? 0;
      const max = spec.chart.axisMax ?? spec.chart.maxValue * 1.08;

      roundRect(panelX, panelY, panelW, panelH, 26, "rgba(11,22,18,0.86)");
      strokeRoundRect(panelX + 1, panelY + 1, panelW - 2, panelH - 2, 26, "rgba(244,247,242,0.14)", 2);
      text("EVOLUTION DU PORTEFEUILLE", panelX + 34, panelY + 58, 24, style.muted, "800");
      legend(panelX + 34, panelY + 82);
      drawAxes(chartLeft, chartStart, chartWidth, chartHeight, min, max);
      drawInvestedLine(chartLeft, chartStart, chartWidth, chartHeight, min, max, chartProgress);
      drawArea(visible, chartLeft, chartStart, chartWidth, chartHeight, min, max);

      ctx.lineWidth = 9;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = style.accent;
      ctx.shadowColor = "rgba(94,230,168,0.34)";
      ctx.shadowBlur = 18;
      ctx.beginPath();
      visible.forEach((point, index) => {
        const x = chartLeft + (index / (points.length - 1)) * chartWidth;
        const y = chartStart + chartHeight - ((point.portfolioValue - min) / (max - min)) * chartHeight;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.shadowBlur = 0;

      const current = visible.at(-1);
      const currentIndex = visible.length - 1;
      const x = chartLeft + (currentIndex / (points.length - 1)) * chartWidth;
      const y = chartStart + chartHeight - ((current.portfolioValue - min) / (max - min)) * chartHeight;
      ctx.fillStyle = style.accentHot;
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.fill();

      const value = formatMoney(current.portfolioValue, spec.chart.currency);
      valueBadge(value, x, y, chartStart);
    }

    function overlays(t) {
      const reveal = clamp((t - 0.76) / 0.13, 0, 1);
      if (reveal > 0) {
        ctx.globalAlpha = reveal;
        roundRect(58, 1384, W - 116, 302, 30, "rgba(241,247,242,0.97)");
        strokeRoundRect(58, 1384, W - 116, 302, 30, "rgba(94,230,168,0.75)", 3);
        text("RESULTAT SIMULE", 98, 1450, 25, "#315547", "900");
        text(spec.narrative.finalLabel, 98, 1540, 80, "#07100c", "900");
        roundRect(98, 1570, 254, 66, 18, spec.narrative.performanceLabel.startsWith("+") ? "#0d9b68" : "#bb3d3d");
        text(spec.narrative.performanceLabel, 122, 1617, 38, "#ffffff", "900");
        text("CAPITAL INVESTI", 626, 1500, 20, "#557264", "800");
        text(spec.narrative.totalInvestedLabel, 626, 1544, 34, "#07100c", "900");
        text("DONNEES HISTORIQUES", 626, 1594, 18, "#557264", "800");
        ctx.globalAlpha = 1;
      }
      const cta = clamp((t - 0.91) / 0.06, 0, 1);
      if (cta > 0) { ctx.globalAlpha = cta; roundRect(72, 1734, W - 144, 72, 20, "rgba(94,230,168,0.14)"); text(spec.narrative.cta, 102, 1782, 31, style.text, "800"); ctx.globalAlpha = 1; }
    }

    function subtitles(seconds) {
      const cue = spec.narrative.subtitles?.find((subtitle) => seconds >= subtitle.start && seconds <= subtitle.end);
      if (!cue) return;
      const maxWidth = W - 144; const lines = wrapLines(cue.text, maxWidth - 80, 42, "800", 2);
      const boxHeight = 58 + lines.length * 54; const boxY = 1708 - boxHeight;
      roundRect(72, boxY, maxWidth, boxHeight, 22, "rgba(2,10,7,0.93)");
      strokeRoundRect(72, boxY, maxWidth, boxHeight, 22, "rgba(94,230,168,0.62)", 2);
      ctx.fillStyle = style.accent; ctx.beginPath(); ctx.arc(107, boxY + 31, 7, 0, Math.PI * 2); ctx.fill();
      lines.forEach((line, index) => { ctx.font = `800 42px ${style.fontFamily}`; const x = (W - ctx.measureText(line).width) / 2; text(line, x, boxY + 58 + index * 54, 42, style.text, "800"); });
    }

    function footer() {
      text("@bourse.io", W - 230, 1870, 24, style.accent, "900");
      text(spec.narrative.disclaimer, 72, 1870, 21, style.muted, "500");
    }

    function drawAxes(chartLeft, chartStart, chartWidth, chartHeight, min, max) {
      ctx.strokeStyle = "rgba(244,247,242,0.28)";
      ctx.lineWidth = 3;
      line(chartLeft, chartStart, chartLeft, chartStart + chartHeight);
      line(chartLeft, chartStart + chartHeight, chartLeft + chartWidth, chartStart + chartHeight);

      ctx.strokeStyle = style.grid;
      ctx.lineWidth = 2;
      spec.chart.valueTicks.forEach((value) => {
        const y = chartStart + chartHeight - ((value - min) / (max - min)) * chartHeight;
        line(chartLeft, y, chartLeft + chartWidth, y);
        const labelY = value === 0 ? y + 18 : value === 1000 && max > 10000 ? y - 18 : y + 8;
        text(formatShortMoney(value, spec.chart.currency), 58, labelY, 22, style.muted, "600");
      });

      spec.chart.dateTicks.forEach((tick) => {
        const x = chartLeft + (tick.index / (points.length - 1)) * chartWidth;
        ctx.strokeStyle = "rgba(244,247,242,0.18)";
        line(x, chartStart, x, chartStart + chartHeight + 10);
        text(tick.label, x - 28, chartStart + chartHeight + 48, 22, style.muted, "700");
      });

      text(spec.chart.xAxisLabel, chartLeft + chartWidth - 74, chartStart + chartHeight + 88, 22, style.muted, "700");
      verticalText(spec.chart.yAxisLabel, 34, chartStart + chartHeight - 90, 22, style.muted, "700");
    }

    function drawInvestedLine(chartLeft, chartStart, chartWidth, chartHeight, min, max, progress) {
      const invested = points.at(-1).invested;
      const y = chartStart + chartHeight - ((invested - min) / (max - min)) * chartHeight;
      const x2 = chartLeft + chartWidth * progress;
      ctx.save();
      ctx.setLineDash([18, 16]);
      ctx.strokeStyle = "rgba(244,201,93,0.88)";
      ctx.lineWidth = 4;
      line(chartLeft, y, x2, y);
      ctx.restore();
      if (progress > 0.18) {
        roundRect(chartLeft + 16, y - 50, 232, 42, 6, "rgba(244,201,93,0.16)");
        text("Capital investi", chartLeft + 32, y - 22, 22, style.accentHot, "800");
      }
    }

    function drawArea(visible, chartLeft, chartStart, chartWidth, chartHeight, min, max) {
      if (visible.length < 2) return;
      const area = ctx.createLinearGradient(0, chartStart, 0, chartStart + chartHeight);
      area.addColorStop(0, "rgba(94,230,168,0.28)");
      area.addColorStop(1, "rgba(94,230,168,0)");
      ctx.fillStyle = area;
      ctx.beginPath();
      visible.forEach((point, index) => {
        const x = chartLeft + (index / (points.length - 1)) * chartWidth;
        const y = chartStart + chartHeight - ((point.portfolioValue - min) / (max - min)) * chartHeight;
        if (index === 0) ctx.moveTo(x, chartStart + chartHeight);
        ctx.lineTo(x, y);
      });
      const lastX = chartLeft + ((visible.length - 1) / (points.length - 1)) * chartWidth;
      ctx.lineTo(lastX, chartStart + chartHeight);
      ctx.closePath();
      ctx.fill();
    }

    function legend(x, y) {
      const items = spec.chart.legendItems;
      items.forEach((item, index) => {
        const offset = index * 250;
        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.arc(x + offset, y, 9, 0, Math.PI * 2);
        ctx.fill();
        text(item.label, x + offset + 22, y + 8, 22, style.text, "700");
      });
    }

    function pill(value, x, y, w, h, fill, color) {
      roundRect(x, y, w, h, 21, fill);
      text(value, x + 28, y + 28, 20, color, "900");
    }

    function valueBadge(value, pointX, pointY, chartStart) {
      const fontSize = 32;
      ctx.font = `800 ${fontSize}px ${style.fontFamily}`;
      const paddingX = 28;
      const badgeW = Math.ceil(ctx.measureText(value).width + paddingX * 2);
      const badgeH = 62;
      const badgeX = clamp(pointX + 20, 74, W - badgeW - 72);
      const badgeY = Math.max(chartStart + 20, pointY - 74);
      roundRect(badgeX, badgeY, badgeW, badgeH, 6, "rgba(244,247,242,0.96)");
      text(value, badgeX + paddingX, badgeY + 40, fontSize, "#07100c", "800");
    }

    function text(value, x, y, size, color, weight) {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px ${style.fontFamily}`;
      ctx.fillText(value, x, y);
    }

    function wrapLines(value, maxWidth, size, weight, maxLines) {
      ctx.font = `${weight} ${size}px ${style.fontFamily}`;
      const lines = [];
      let line = "";
      for (const word of value.split(" ")) {
        const next = line ? `${line} ${word}` : word;
        if (ctx.measureText(next).width > maxWidth && line) {
          lines.push(line);
          line = word;
          if (lines.length >= maxLines) break;
        } else {
          line = next;
        }
      }
      if (line && lines.length < maxLines) lines.push(line);
      return lines;
    }

    function wrapText(value, x, y, maxWidth, size, color, weight, maxLines) {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px ${style.fontFamily}`;
      const words = value.split(" ");
      let line = "";
      let lineCount = 0;
      for (const word of words) {
        const next = line ? `${line} ${word}` : word;
        if (ctx.measureText(next).width > maxWidth && line) {
          ctx.fillText(line, x, y + lineCount * size * 1.16);
          line = word;
          lineCount += 1;
          if (lineCount >= maxLines) return;
        } else {
          line = next;
        }
      }
      if (line && lineCount < maxLines) ctx.fillText(line, x, y + lineCount * size * 1.16);
    }

    function roundRect(x, y, w, h, r, fill) {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function strokeRoundRect(x, y, w, h, r, stroke, width) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.stroke();
    }

    function line(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function smoothstep(value) {
      return value * value * (3 - 2 * value);
    }

    function formatMoney(value, currency) {
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency,
        maximumFractionDigits: value >= 1000 ? 0 : 2
      }).format(value);
    }

    function formatShortMoney(value, currency) {
      if (Math.abs(value) < 10000) {
        return `${new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 }).format(value)} ${symbol(currency)}`;
      }
      if (Math.abs(value) >= 1000000) {
        return `${formatCompactNumber(value / 1000000)}M ${symbol(currency)}`;
      }
      return `${formatCompactNumber(value / 1000)}k ${symbol(currency)}`;
    }

    function formatCompactNumber(value) {
      const rounded = Math.round(value * 10) / 10;
      return new Intl.NumberFormat("fr-FR", {
        maximumFractionDigits: rounded % 1 === 0 ? 0 : 1
      }).format(rounded);
    }

    function symbol(currency) {
      return currency === "EUR" ? "€" : currency;
    }

    function verticalText(value, x, y, size, color, weight) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 2);
      text(value, 0, 0, size, color, weight);
      ctx.restore();
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
